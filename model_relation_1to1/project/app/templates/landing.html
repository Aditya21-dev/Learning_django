<!DOCTYPE html>
<html>
<head>
    <title>Table with Separate Buttons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        table {
            width: 70%;
            margin: 0 auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn-container {
            margin-top: 25px;
        }

        button {
            padding: 8px 18px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Employee Data</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>IT</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>HR</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Amit</td>
            <td>Finance</td>
        </tr>
        <tr>
            <td>104</td>
            <td>Sneha</td>
            <td>Marketing</td>
        </tr>
    </table>

    <div class="btn-container">
        <button>Add</button>
        <button>Edit</button>
        <button>Delete</button>
    </div>

</body>
</html>
