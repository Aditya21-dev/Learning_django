
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <style>

    body {
        margin: 0;
        padding: 0;
        background: #0d0d0d;
        font-family: Arial, sans-serif;
    }

    .signup-page {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* CARD */
    .signup-card {
        background: #111;
        padding: 40px;
        border-radius: 15px;
        width: 350px;
        color: white;
        box-shadow: 0 0 20px rgba(255, 77, 77, 0.2);
    }

    /* TITLE */
    .signup-card h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    /* INPUT */
    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
        color: #ccc;
    }

    .input-group input {
        width: 100%;
        padding: 10px;
        border: none;
        outline: none;
        border-radius: 6px;
        background: #1a1a1a;
        color: white;
    }

    /* BUTTON */
    .signup-btn {
        width: 100%;
        padding: 12px;
        background: #ff4d4d;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .signup-btn:hover {
        background: #e63e3e;
    }

    /* FOOTER */
    .footer-text {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
        color: #aaa;
    }

    .footer-text a {
        color: #ff4d4d;
        text-decoration: none;
    }

    </style>
</head>

<body>

<section class="signup-page">

    <div class="signup-card">

        <h2>Create Account</h2>

        {% if messages %}
            {% for message in messages %}
            <div style="
                padding: 12px 18px;
                margin-bottom: 15px;
                border-radius: 6px;
                background-color: {% if message.tags == 'success' %}#dcfce7{% elif message.tags == 'error' %}#fee2e2{% else %}#e0f2fe{% endif %};
                color: #111827;
                font-size: 14px;">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" name="address" placeholder="Enter your Address" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>

        </form>

        <div class="footer-text">
            Already have an account? <a href="/login/">Login</a>
        </div>

    </div>

</section>

</body>
</html>
