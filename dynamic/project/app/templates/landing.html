<!DOCTYPE html>
<html>
<head>
    <title>Media Upload Form</title>
</head>
<body>

    <h2>Media Submission Form</h2>

    <form action="{% url 'form_data' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Personal Details -->
        <label>Full Name:</label><br>
        <input type="text" name="full_name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone"><br><br>

        <!-- Media Info -->
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Category:</label><br>
        <select name="category">
            <option value="image">Image</option>
            <option value="video">Video</option>
            <option value="audio">Audio</option>
            <option value="document">Document</option>
        </select><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40"></textarea><br><br>

        <!-- File Uploads -->
        <label>Upload Image:</label><br>
        <input type="file" name="image" accept="image/*"><br><br>

        <label>Upload Video:</label><br>
        <input type="file" name="video" accept="video/*"><br><br>

        <label>Upload Audio:</label><br>
        <input type="file" name="audio" accept="audio/*"><br><br>

        <label>Upload Document:</label><br>
        <input type="file" name="document" accept=".pdf,.doc,.docx,.txt"><br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
