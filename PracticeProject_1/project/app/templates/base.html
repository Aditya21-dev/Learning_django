<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block title %}
    <title>Document</title>
    {% endblock title %}

    {% block css %}

    {% endblock css %}

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    .navbar {
    background: #1e293b;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    }

    .logo a {
    color: white;
    text-decoration: none;
    font-size: 24px;
    font-weight: bold;
    }

    .nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
    }

    .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
    }

    .nav-links a:hover {
    color: #38bdf8;
    }

    @media (max-width: 768px) {
    .navbar {
    flex-direction: column;
    gap: 15px;
    }

    .nav-links {
    flex-direction: column;
    text-align: center;
    gap: 12px;
    }
    }
    </style>


</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <a href="/">MyProject</a>
        </div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about/">About</a></li>
            <li><a href="/services/">Services</a></li>
            <li><a href="/contact/">Contact</a></li>

            {% if user.is_authenticated %}
            <li><a href="/profile/">Profile</a></li>
            <li><a href="/logout/">Logout</a></li>
            {% else %}
            <li><a href="/login/">Login</a></li>
            <li><a href="/register/">Register</a></li>
            {% endif %}
        </ul>
    </nav>

    {% block content %}

    {% endblock content %}

</body>

</html>
