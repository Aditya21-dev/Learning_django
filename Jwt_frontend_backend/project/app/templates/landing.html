<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Registration Form</title>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Registration Form</h2>

                <form action="{% url "landing" %}" method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Employee Name</label>
                        <input type="text" name="emp_name" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Employee Email</label>
                        <input type="email" name="emp_email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="emp_department" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <input type="text" name="emp_role" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="emp_password" class="form-control">
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary">JWT Token</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
