<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %} base {% endblock %}</title>
        <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background-color: #0d1b2a;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #00b4d8;
        }

        /* ===== MAIN CONTENT ===== */
        .content {
            padding: 50px;
            min-height: 70vh;
        }

        /* ===== FOOTER ===== */
        .footer {
            background-color: #0d1b2a;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>


    {% block css %}

    {% endblock css %}


</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>


    {% block content %}
    
    {% endblock content %}


    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 MyWebsite | All Rights Reserved</p>
    </footer>

</body>

</html>
