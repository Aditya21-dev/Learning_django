{% extends "base.html" %}

{% block content %}

<body>

    <div class="todo-container">

        <h1>My To-Do List</h1>

        <!-- Add Task Form -->
        <form action="{% url "add_task" %}" method="POST" class="todo-form">
            {% csrf_token %}
            
            <div class="input-group">
                <label for="task">New Task:</label>
                <input type="text" id="task" name="task" placeholder="Enter your task" required>
                <button type="submit">  Add Task </button>
            </div>

        </form>

        <hr>

    </div>
    {% if task_list %}
        
        <!-- Task List -->
        <ul class="task-list">

            <!-- Single Task -->
            {% for i in task_d %}
            <li>
                <form action="#" method="POST" class="task-item">

                    <input type="checkbox" name="completed">

                    <span>{{i.task}}</span>

                    <button type="submit" name="edit">Edit</button>
                    <button type="submit" name="delete">Delete</button>

                </form>
            </li>
            {% endfor %}

        </ul>
    {% endif %}

</body>

{% endblock content %}
