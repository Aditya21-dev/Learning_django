<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All HTML Input Types</title>
</head>
<body>

    <h2>HTML Form Practice</h2>

    <form action="" method="POST">
        {% csrf_token %}
        <!-- Text -->
        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter your name">
        <br><br>

        <!-- Password -->
        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <!-- Number -->
        <label>Age:</label>
        <input type="number" name="age" min="1" max="100">
        <br><br>

        <!-- Telephone -->
        <label>Phone:</label>
        <input type="tel" name="phone">
        <br><br>

        <!-- URL -->
        <label>Website:</label>
        <input type="url" name="website">
        <br><br>

        <!-- Search -->
        <label>Search:</label>
        <input type="search" name="search">
        <br><br>

        <!-- Date -->
        <label>Date:</label>
        <input type="date" name="date">
        <br><br>

        <!-- Time -->
        <label>Time:</label>
        <input type="time" name="time">
        <br><br>

        <!-- DateTime Local -->
        <label>Date & Time:</label>
        <input type="datetime-local" name="datetime">
        <br><br>

        <!-- Month -->
        <label>Month:</label>
        <input type="month" name="month">
        <br><br>

        <!-- Week -->
        <label>Week:</label>
        <input type="week" name="week">
        <br><br>

        <!-- Color -->
        <label>Favorite Color:</label>
        <input type="color" name="color">
        <br><br>

        <!-- Range -->
        <label>Volume:</label>
        <input type="range" name="volume" min="0" max="100">
        <br><br>

        <!-- Radio -->
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <!-- Checkbox -->
        <label>Languages:</label><br>
        <input type="checkbox" name="python" value="Python"> Python
        <input type="checkbox" name="java" value="Java"> Java
        <input type="checkbox" name="cpp" value="C++"> C++
        <br><br>

        <!-- Hidden -->
        <input type="hidden" name="userid" value="101">

        <!-- Select -->
        <label>City:</label>
        <select name="city">
            <option value="">--Select City--</option>
            <option value="Bhopal">Bhopal</option>
            <option value="Delhi">Delhi</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Indore">Indore</option>
        </select>
        <br><br>

        <!-- Textarea -->
        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <!-- Reset -->
        <input type="reset" value="Reset Form">

        <!-- Submit -->
        <input type="submit" value="Submit">

        <!-- Button -->
        <input type="button" value="Click Me">

    </form>

</body>
</html>

</body>
</html>
